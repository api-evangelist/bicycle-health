summary: >-
  Bicycle Health publishes a healthcare regulatory and certification posture, not an
  API conformance posture. It is a clinical telehealth organization with no public
  API, so every cross-cutting API standard below is recorded as not-applicable rather
  than failed. What it does publish — verified on its own site — is a HIPAA Notice of
  Privacy Practices, a LegitScript certification seal, and American Telemedicine
  Association membership.

standards:
