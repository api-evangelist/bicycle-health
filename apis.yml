aid: bicycle-health
name: Bicycle Health
description: 'Bicycle Health is a US telehealth provider of Medication for Addiction
  Treatment (MAT) for opioid use disorder (OUD), founded in 2017 by Ankit Gupta in
  Redwood City, California and delivering virtual care since 2020. Care is delivered
  entirely by secure video visit — intake, provider visits, treatment planning and
  ongoing support — with prescriptions sent electronically to a pharmacy near the
  patient. Medications offered include buprenorphine/naloxone (Suboxone), monthly
  injectable buprenorphine (Sublocade), weekly or monthly injectable buprenorphine
  (Brixadi) and monthly injectable naltrexone (Vivitrol), and the company also treats
  kratom and 7-hydroxymitragynine (7-OH) dependence. Bicycle Health accepts most major
  insurers including Medicaid (in most states it operates in), Medicare and TRICARE,
  states it has helped over 55,000 patients across 25+ US states, and was named a
  TIME100 Most Influential Company in 2022 and a Fast Company Most Innovative Company
  in 2024. It is a clinical care organization rather than a software vendor: it ships
  a patient web and mobile application backed by a private API host, but publishes
  no public developer program, API documentation, SDK or machine-readable contract.'
